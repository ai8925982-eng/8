name: Build Windows EXE

on:
  workflow_dispatch:        # Actions tab -> "Build Windows EXE" -> Run workflow
  push:
    branches: [main, master]
    tags: ["v*"]            # git tag v0.1.0 && git push --tags -> also creates a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check project files are present
        shell: pwsh
        run: |
          $required = @(
            "run_app.py",
            "src/aimusicgen/__init__.py",
            "src/aimusicgen/cli.py",
            "src/aimusicgen/gui.py",
            "src/aimusicgen/pipeline.py",
            "src/aimusicgen/composer.py",
            "src/aimusicgen/synth.py"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::Project files are missing from the repository: $($missing -join ', ')"
            Write-Host "Upload the WHOLE project (run_app.py, src/, tests/ ...), not only the workflow file. See README step 2."
            Get-ChildItem -Recurse -Name | Select-Object -First 50
            exit 1
          }
          Write-Host "All required files found."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pytest pyinstaller soundfile

      - name: Run tests
        if: hashFiles('tests/test_pipeline.py') != ''
        continue-on-error: true      # a failing test does not stop the exe build
        run: python -m pytest -q

      - name: Build GUI exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIMusicGenerator --paths src --collect-submodules aimusicgen run_app.py

      - name: Build CLI exe
        run: python -m PyInstaller --noconfirm --onefile --console --name AIMusicGenerator-cli --paths src --collect-submodules aimusicgen run_app.py

      - name: Smoke test the CLI exe
        run: .\dist\AIMusicGenerator-cli.exe -g all --bars 8 --seed 1 -o smoke_output

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\AIMusicGenerator.exe, dist\AIMusicGenerator-cli.exe release\
          if (Test-Path README.md) { Copy-Item README.md release\ }
          if (Test-Path LICENSE) { Copy-Item LICENSE release\ }
          Compress-Archive -Path release\* -DestinationPath AIMusicGenerator-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AIMusicGenerator-windows
          path: AIMusicGenerator-windows.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AIMusicGenerator-windows.zip
